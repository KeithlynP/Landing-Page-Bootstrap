<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Suscripción — K‑P Advance BioTech’s</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-primary bg-gradient text-white text-center py-4 px-3">
        <h1 class="fw-bold">K‑P Advance BioTech’s</h1>
        <p class="mb-0">Formulario de Suscripción</p>
    </header>

    <main class="container text-center py-5 px-3">
        <h2 class="text-primary mb-4">Únete a Nuestra Comunidad Científica</h2>

        <form class="col-12 col-sm-8 col-md-6 col-lg-4 mx-auto text-start">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico:</label>
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Suscribirme</button>
        </form>

        <a href="landingPage.html" class="btn btn-success fw-bold mt-4">Regresar a la página principal</a>
    </main>

    <footer class="bg-dark text-white text-center py-3 px-3 mt-auto">
        <p class="mb-0 opacity-75">Contacto: kpadvance@biotech.org</p>
    </footer>

</body>
</html>
